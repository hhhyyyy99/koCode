# ============================================================================
# koCode Configuration Example
# ============================================================================
# Copy to ~/.kocode/config.yaml and fill in your API keys.
#   cp config.example.yaml ~/.kocode/config.yaml
# Or run: kocode config init
# ============================================================================
#
# ── 快速上手 ──────────────────────────────────────────────────────────────────
# 自定义 provider 只需 3 行，模型元数据自动复用内置的：
#
#   providers:
#     mimo:
#       apiKey: "tp-xxx"
#       baseUrl: "https://token-plan-cn.xiaomimimo.com/anthropic"
#
#   default:
#     provider: "mimo"
#     model: "claude-sonnet-4-5-20250514"   ← 直接用内置模型名
#
# 解释：koCode 会从内置模型库找到 claude-sonnet-4-5-20250514 的完整定义
#（contextWindow、maxTokens、cost、reasoning 等），然后替换 provider 和
# baseUrl 为你的自定义值。不需要手动填一堆参数。
# ============================================================================

providers:

  # ── Anthropic ────────────────────────────────────────────────────────────
  anthropic:
    apiKey: "sk-ant-api03-your-key-here"

  # ── OpenAI ───────────────────────────────────────────────────────────────
  openai:
    apiKey: "sk-proj-your-key-here"

  # ── Google Gemini ────────────────────────────────────────────────────────
  google:
    apiKey: "your-google-api-key"

  # ── DeepSeek ─────────────────────────────────────────────────────────────
  deepseek:
    apiKey: "sk-your-deepseek-key"
    baseUrl: "https://api.deepseek.com/v1"

  # ── Token-Plan 类 Provider（如 mimo、xiaomi 等）────────────────────────
  # 自动复用内置模型元数据，只需 3 行。
  #
  # mimo:
  #   apiKey: "tp-your-token"
  #   baseUrl: "https://token-plan-cn.xiaomimimo.com/anthropic"
  #
  # 用法: kocode --provider mimo --model claude-sonnet-4-5-20250514
  #
  # 如需定义内置模型库没有的模型，才需要写 models 字段（见下方"自定义模型"）

  # ── 自定义模型（仅在内置模型库找不到时才需要）───────────────────────────
  # openai:
  #   apiKey: "sk-xxx"
  #   models:
  #     "my-fine-tuned-model":
  #       api: "openai-completions"
  #       contextWindow: 131072
  #       maxTokens: 8192
  #       reasoning: false
  #       input: ["text"]
  #       cost:
  #         input: 1
  #         output: 5
  #         cacheRead: 0.1
  #         cacheWrite: 1

  # ── 自定义 Headers（x-api-key 替代 Bearer）───────────────────────────────
  # my-provider:
  #   apiKey: "placeholder"
  #   baseUrl: "https://api.example.com/v1"
  #   models:
  #     "model-v1":
  #       api: "openai-completions"
  #       headers:
  #         "x-api-key": "real-token"
  #         "x-region": "cn"

# ── Default Model ──────────────────────────────────────────────────────────
default:
  provider: "anthropic"
  model: "claude-sonnet-4-5-20250514"
